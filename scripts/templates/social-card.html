<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Bagel Fat One"; src: url("/assets/fonts/bagel-fat-one-latin.woff2") format("woff2"); }
  @font-face { font-family: "Space Grotesk"; src: url("/assets/fonts/space-grotesk-latin-variable.woff2") format("woff2"); font-weight: 300 700; }

  :root {
    --bg: #07060d; --fg: #f3f0ff; --muted: #8b86a3; --ink: #171029;
    --display: "Bagel Fat One", sans-serif;
    --key: #ab8fff; --key-side: #6442c9;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    color: var(--fg);
    font-family: "Space Grotesk", sans-serif;
    background:
      radial-gradient(900px 480px at 78% 46%, color-mix(in srgb, var(--key) 30%, transparent), transparent 70%),
      radial-gradient(760px 360px at 18% -60px, rgba(171, 143, 255, .22), transparent 70%),
      radial-gradient(rgba(243, 240, 255, .07) 1.4px, transparent 2px) 0 0 / 26px 26px,
      var(--bg);
  }
  .card { position: absolute; inset: 0; }

  .letter {
    display: inline-block;
    color: var(--c);
    text-shadow:
      0 .012em 0 var(--d), 0 .024em 0 var(--d), 0 .036em 0 var(--d),
      0 .048em 0 var(--d), 0 .06em 0 var(--d), 0 .072em 0 var(--d),
      0 .12em .1em rgba(0, 0, 0, .55);
  }
  .wordmark { font-family: var(--display); white-space: nowrap; line-height: 1; }

  .brandbar {
    position: absolute; left: 64px; right: 64px; bottom: 44px;
    display: flex; align-items: center; justify-content: space-between;
    color: var(--muted); font-size: 24px; font-weight: 600;
  }
  .brandbar img { height: 30px; width: auto; display: block; }
  .brandbar b { color: var(--fg); font-weight: 600; }

  /* ---------- Sound ---------- */
  .sound .wordmark { position: absolute; left: 64px; top: 52px; font-size: 44px; }
  .sound__text { position: absolute; left: 64px; top: 150px; width: 560px; height: 330px; display: flex; flex-direction: column; }
  .chip {
    align-self: flex-start;
    padding: 8px 18px; border-radius: 999px;
    color: var(--ink); background: var(--key);
    box-shadow: 0 5px 0 var(--key-side);
    font-size: 24px; font-weight: 700;
  }
  .sound__name {
    flex: 1; display: flex; align-items: center;
    margin-top: 14px;
    font-family: var(--display); line-height: 1.02;
    overflow-wrap: anywhere;
    text-shadow: 0 .06em 0 var(--key-side), 0 .14em .2em rgba(0, 0, 0, .5);
  }
  .sound__name span { display: block; }
  .sound__cta { font-size: 28px; font-weight: 600; color: color-mix(in srgb, var(--key) 45%, #fff); }

  .key {
    position: absolute; right: 70px; top: 128px;
    width: 440px; height: 330px;
    transform: perspective(900px) rotateY(-10deg) rotateX(6deg) rotate(2deg);
  }
  .key__well { position: absolute; inset: -10px -10px -12px; border-radius: 44px; background: #040308; box-shadow: inset 0 4px 8px #000, 0 0 70px 6px color-mix(in srgb, var(--key) 55%, transparent); }
  .key__side { position: absolute; inset: 45% 0 0; border-radius: 0 0 34px 34px; background: linear-gradient(90deg, rgba(0,0,0,.3), transparent 12%, transparent 88%, rgba(0,0,0,.3)), var(--key-side); }
  .key__face {
    position: absolute; inset: 0 0 26px;
    display: flex; flex-direction: column; justify-content: space-between; align-items: center;
    padding: 26px 30px 22px;
    border-radius: 34px; color: var(--ink);
    background: radial-gradient(120% 85% at 28% 0%, rgba(255,255,255,.4), transparent 58%), var(--key);
    box-shadow: inset 0 3px 0 rgba(255,255,255,.6), inset 0 -4px 0 rgba(0,0,0,.14);
  }
  .key__time { align-self: flex-end; font-size: 26px; font-weight: 700; opacity: .7; }
  .key__play { display: grid; place-items: center; width: 128px; height: 128px; border-radius: 50%; background: var(--ink); box-shadow: 0 7px 0 rgba(0,0,0,.25); }
  .key__play svg { width: 56px; height: 56px; margin-left: 10px; fill: var(--key); }
  .key__wave { width: 100%; height: 50px; }
  .key__wave svg { width: 100%; height: 100%; fill: none; stroke: var(--ink); stroke-width: 4px; stroke-linecap: round; }
  .key__wave path { vector-effect: non-scaling-stroke; }
  .key__wave .base { opacity: .28; }
  .key__wave .lit { clip-path: inset(0 58% 0 0); }

  .notes svg { position: absolute; fill: var(--c); filter: drop-shadow(0 4px 0 rgba(0,0,0,.45)); }

  /* ---------- Home ---------- */
  .home { text-align: center; }
  .home .wordmark { position: absolute; left: 0; right: 0; top: 70px; }
  .home .line { display: block; }
  .home .line--small { font-size: 92px; }
  .home .line--big { font-size: 150px; margin-top: 6px; }
  .home__tag { position: absolute; left: 0; right: 0; top: 352px; color: #c9c3e2; font-size: 34px; font-weight: 500; }
  .ribbon {
    position: absolute; left: -40px; right: -40px; top: 430px;
    padding: 10px 0; overflow: hidden; white-space: nowrap;
    color: var(--ink); background: var(--fg);
    box-shadow: 0 6px 0 var(--muted), 0 18px 30px rgba(0,0,0,.5);
    transform: rotate(-2deg);
    font-family: var(--display); font-size: 30px;
  }
  .ribbon span { display: inline-flex; align-items: center; }
  .ribbon svg { width: 24px; height: 24px; margin: 0 18px; fill: currentColor; }
  .home .brandbar { bottom: 36px; }

  /* ---------- Leaderboard ---------- */
  .ranks .wordmark { position: absolute; left: 64px; top: 52px; font-size: 44px; }
  .ranks__eyebrow { position: absolute; left: 64px; top: 168px; display: flex; align-items: center; gap: 12px; color: #ffc93c; font-size: 28px; font-weight: 700; }
  .ranks__eyebrow svg { width: 32px; height: 32px; fill: none; stroke: currentColor; stroke-width: 2.25; stroke-linecap: round; stroke-linejoin: round; }
  .ranks__live { padding: 4px 12px; border-radius: 999px; color: var(--ink); background: #ff8360; font-size: 18px; letter-spacing: .08em; }
  .ranks__title { position: absolute; left: 64px; top: 220px; width: 560px; font-family: var(--display); font-size: 92px; line-height: 1; text-shadow: 0 .06em 0 #bd8406, 0 .14em .2em rgba(0,0,0,.5); }
  .ranks__tag { position: absolute; left: 64px; top: 432px; width: 520px; color: #c9c3e2; font-size: 26px; }
  .podium { position: absolute; right: 64px; bottom: 120px; display: flex; align-items: flex-end; gap: 14px; }
  .step { position: relative; width: 150px; display: flex; flex-direction: column; align-items: center; }
  .step svg { width: 96px; height: 96px; margin-bottom: 14px; filter: drop-shadow(0 6px 0 rgba(0,0,0,.4)); }
  .step svg { fill: var(--c); }
  .step__block {
    width: 100%; display: grid; place-items: start center; padding-top: 18px;
    border-radius: 22px 22px 0 0;
    color: var(--ink); background: var(--c);
    box-shadow: inset 0 3px 0 rgba(255,255,255,.5), 0 8px 0 var(--d);
    font-family: var(--display); font-size: 64px;
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <symbol id="play" viewBox="0 0 24 24"><path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"/></symbol>
  <symbol id="n1" viewBox="0 0 24 24"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3z"/></symbol>
  <symbol id="n2" viewBox="0 0 24 24"><path d="M9 5v9.55A3.5 3.5 0 1 0 11 18V8.6l8-1.8v5.75A3.5 3.5 0 1 0 21 16V3z"/></symbol>
  <symbol id="n3" viewBox="0 0 24 24"><path d="M13 3v11.55A4 4 0 1 0 15 18V3z"/></symbol>
  <symbol id="trophy" viewBox="0 0 24 24"><path d="M10 14.66v1.626a2 2 0 0 1-.976 1.696A5 5 0 0 0 7 21.978"/><path d="M14 14.66v1.626a2 2 0 0 0 .976 1.696A5 5 0 0 1 17 21.978"/><path d="M18 9h1.5a1 1 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M6 9a6 6 0 0 0 12 0V3a1 1 0 0 0-1-1H7a1 1 0 0 0-1 1z"/><path d="M6 9H4.5a1 1 0 0 1 0-5H6"/></symbol>
  <symbol id="cup" viewBox="0 0 64 64"><path class="cup__body" fill-rule="evenodd" d="M16 6h32v4h8a2 2 0 0 1 2 2v6c0 8-6 13-13 13.6A16 16 0 0 1 35 39v7h7a3 3 0 0 1 3 3v3H19v-3a3 3 0 0 1 3-3h7v-7a16 16 0 0 1-10-7.4C12 31 6 26 6 18v-6a2 2 0 0 1 2-2h8zM10 14h6v8c0 1.8.3 3.5.8 5.1C13 25.8 10 22.6 10 18zM54 14h-6v8c0 1.8-.3 3.5-.8 5.1C51 25.8 54 22.6 54 18z"/><path class="cup__base" d="M14 54h36a2 2 0 0 1 2 2v4H12v-4a2 2 0 0 1 2-2z"/><path class="cup__star" d="M32 11.5l2.6 5.3 5.8.8-4.2 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z"/></symbol>
</svg>
<div id="root"></div>
<script>
  const CANDY = [
    ['#35d6c8', '#12877c'], ['#ab8fff', '#6442c9'], ['#ff7eb6', '#c0407b'],
    ['#ffc93c', '#bd8406'], ['#ff8360', '#bf4526'], ['#93e571', '#479c2c'],
  ];
  const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

  function letters(word, plain) {
    return Array.from(word).map((ch, i) => {
      const [c, d] = plain ? ['#f3f0ff', '#8b86a3'] : CANDY[i % CANDY.length];
      return '<span class="letter" style="--c:' + c + ';--d:' + d + '">' + esc(ch) + '</span>';
    }).join('');
  }
  const wordmark = (cls) => '<div class="wordmark ' + (cls || '') + '">' + letters('Simple', true) + ' ' + letters('Soundboard') + '</div>';
  const brandbar = (text) => '<div class="brandbar"><span>' + text + '</span><img src="/assets/retrac-space-logo.png" alt=""></div>';
  const notes = (spots) => '<div class="notes">' + spots.map(([x, y, s, r], i) =>
    '<svg style="left:' + x + 'px;top:' + y + 'px;width:' + s + 'px;height:' + s + 'px;transform:rotate(' + r + 'deg);--c:' + CANDY[i % CANDY.length][0] + '"><use href="#n' + (i % 3 + 1) + '"/></svg>').join('') + '</div>';

  function formatSeconds(seconds) {
    if (seconds < 10) return seconds.toFixed(1) + 's';
    if (seconds < 60) return Math.round(seconds) + 's';
    const whole = Math.round(seconds);
    return Math.floor(whole / 60) + ':' + String(whole % 60).padStart(2, '0');
  }

  async function waveform(src, bars) {
    try {
      const data = await (await fetch(src)).arrayBuffer();
      const buffer = await new OfflineAudioContext(1, 1, 44100).decodeAudioData(data);
      const samples = buffer.getChannelData(0);
      const size = samples.length / bars;
      const values = [];
      for (let b = 0; b < bars; b++) {
        let peak = 0;
        for (let i = Math.floor(b * size); i < Math.floor((b + 1) * size); i += 8) peak = Math.max(peak, Math.abs(samples[i]));
        values.push(Math.sqrt(Math.min(1, peak)));
      }
      return { values, duration: buffer.duration };
    } catch (error) {
      return { values: Array.from({ length: bars }, (_, i) => .3 + .5 * Math.abs(Math.sin(i * 1.7))), duration: null };
    }
  }

  function wavePath(values) {
    const step = 100 / (values.length - 1);
    return values.map((v, i) => {
      const h = Math.max(.06, v) * 15;
      return 'M' + (i * step).toFixed(2) + ' ' + (16 - h).toFixed(2) + 'V' + (16 + h).toFixed(2);
    }).join('');
  }

  function fit(box, inner, max, min) {
    let size = max;
    inner.style.fontSize = size + 'px';
    while (size > min && (inner.scrollHeight > box.clientHeight || inner.scrollWidth > box.clientWidth)) {
      size -= 2;
      inner.style.fontSize = size + 'px';
    }
  }

  window.renderCard = async function (card) {
    const root = document.getElementById('root');
    document.documentElement.style.setProperty('--key', card.color || '#ab8fff');
    document.documentElement.style.setProperty('--key-side', card.side || '#6442c9');

    if (card.kind === 'sound') {
      const wave = await waveform(card.src, 40);
      const d = wavePath(wave.values);
      root.innerHTML = '<div class="card sound">' + wordmark()
        + '<div class="sound__text"><span class="chip">' + esc(card.category) + '</span>'
        + '<div class="sound__name" id="nameBox"><span id="name">' + esc(card.name) + '</span></div>'
        + '<p class="sound__cta">Tap to play it on Simple Soundboard</p></div>'
        + '<div class="key"><span class="key__well"></span><span class="key__side"></span><span class="key__face">'
        + '<span class="key__time">' + (wave.duration ? formatSeconds(wave.duration) : '') + '</span>'
        + '<span class="key__play"><svg><use href="#play"/></svg></span>'
        + '<span class="key__wave"><svg viewBox="0 0 100 32" preserveAspectRatio="none"><path class="base" d="' + d + '"/><path class="lit" d="' + d + '"/></svg></span>'
        + '</span></div>'
        + notes([[1080, 70, 44, -12], [640, 520, 34, 10], [1120, 500, 30, 16]])
        + brandbar('') + '</div>';
      await document.fonts.ready;
      fit(document.getElementById('nameBox'), document.getElementById('name'), 96, 40);
    } else if (card.kind === 'home') {
      const words = card.words.map((w, i) => '<span>' + esc(w.toLowerCase()) + '<svg><use href="#n' + (i % 3 + 1) + '"/></svg></span>').join('');
      root.innerHTML = '<div class="card home">'
        + '<div class="wordmark"><span class="line line--small">' + letters('Simple', true) + '</span><span class="line line--big">' + letters('Soundboard') + '</span></div>'
        + '<p class="home__tag">Fun sound effects without the bloat.</p>'
        + '<div class="ribbon">' + words + '</div>'
        + notes([[70, 60, 54, -12], [1060, 80, 48, 12], [150, 300, 36, 8], [1010, 300, 40, -10], [260, 140, 30, 14], [930, 170, 30, -6]])
        + brandbar('Free · No ads') + '</div>';
      await document.fonts.ready;
    } else if (card.kind === 'leaderboard') {
      document.documentElement.style.setProperty('--key', '#ffc93c');
      const step = (place, height, c, d) => '<div class="step" style="--c:' + c + ';--d:' + d + '"><svg><use href="#cup"/></svg><div class="step__block" style="height:' + height + 'px">' + place + '</div></div>';
      root.innerHTML = '<div class="card ranks">' + wordmark()
        + '<p class="ranks__eyebrow"><svg><use href="#trophy"/></svg>Sound Leaderboard <span class="ranks__live">LIVE</span></p>'
        + '<h1 class="ranks__title">Most Played Sounds</h1>'
        + '<p class="ranks__tag">Every play from everyone, counted live.</p>'
        + '<div class="podium">' + step(2, 150, '#d9d5ea', '#8b86a3') + step(1, 220, '#ffc93c', '#bd8406') + step(3, 110, '#ff9d5c', '#bd6325') + '</div>'
        + brandbar('') + '</div>';
      await document.fonts.ready;
    }
    await Promise.all(Array.from(document.images).map((img) => img.complete ? null : new Promise((r) => { img.onload = img.onerror = r; })));
  };
</script>
</body>
</html>
