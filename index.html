  <!--
    The kernel. This page never reloads: the app itself lives in index-data.html and runs in the
    frame below, so "Check for Updates" can fetch fresh copies of every file and restart the app
    without refreshing the tab. Keep this page small; it only updates on a real reload.
  -->
  <style>
    html, body { height: 100%; margin: 0; overflow: hidden; background: #07060d; }
    .kernel-app {
      position: fixed;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #07060d;
    }
    .kernel-noscript { margin: 0; padding: 40px 16px; color: #f3efff; font: 1rem/1.5 system-ui, sans-serif; text-align: center; }
  </style>
</head>
<body>
  <iframe class="kernel-app" id="kernelApp" title="Simple Soundboard" allow="autoplay; clipboard-write; fullscreen; web-share"></iframe>
  <noscript><p class="kernel-noscript">Simple Soundboard needs JavaScript turned on.</p></noscript>
  <script>
    (function () {
      'use strict';

      var APP = 'index-data.html';
      var frame = document.getElementById('kernelApp');
      var base = new URL('./', location.href);
      var appPath = new URL(APP, base).pathname;
      var kernelPaths = [base.pathname, new URL('index.html', base).pathname];

      // A kernel opened inside another kernel's frame (say, a link back to "/") just becomes the app.
      try {
        if (window.parent !== window && window.parent.SoundboardKernel) {
          location.replace(APP + location.search + location.hash);
          return;
        }
      } catch (error) { /* Framed by another site; carry on as a normal kernel. */ }

      var checking = null;

      function appUrl(search, hash) {
        var url = new URL(APP, base);
        url.search = search;
        url.hash = hash;
        return url.href;
      }

      function frameLocation() {
        try {
          var loc = frame.contentWindow.location;
          return loc.href ? loc : null;
        } catch (error) {
          return null; // Cross-origin, or a file:// page the kernel can't look into.
        }
      }

      // The tab's address follows the app's, with the kernel's path in place of index-data.html.
      function syncAddress() {
        var loc = frameLocation();
        if (!loc || loc.pathname !== appPath) return;
        var next = base.pathname + loc.search + loc.hash;
        if (next !== location.pathname + location.search + location.hash) {
          history.replaceState(history.state, '', next);
        }
      }

      function syncTitle() {
        try {
          if (frame.contentDocument.title) document.title = frame.contentDocument.title;
        } catch (error) { /* Not reachable. */ }
      }

      function attach(win) {
        var doc = win.document;
        // pushState and replaceState fire no events, so watch them directly.
        ['pushState', 'replaceState'].forEach(function (name) {
          var original = win.history[name];
          win.history[name] = function () {
            var result = original.apply(this, arguments);
            syncAddress();
            return result;
          };
        });
        win.addEventListener('hashchange', syncAddress);
        win.addEventListener('popstate', syncAddress);
        new MutationObserver(syncTitle).observe(doc.head, { childList: true, subtree: true, characterData: true });

        // Links that leave the app open in the tab rather than inside the frame.
        doc.addEventListener('click', function (event) {
          var link = event.target.closest && event.target.closest('a[href]');
          if (!link || link.target || link.hasAttribute('download')) return;
          var url = new URL(link.href, doc.baseURI);
          var inApp = url.origin === location.origin
            && (url.pathname === appPath || kernelPaths.indexOf(url.pathname) !== -1);
          if (!inApp) link.target = '_top';
        }, true);

        syncAddress();
        syncTitle();
      }

      frame.addEventListener('load', function () {
        var loc = frameLocation();
        if (!loc || loc.href === 'about:blank') return;
        if (loc.origin === location.origin && kernelPaths.indexOf(loc.pathname) !== -1) {
          // Something inside the app pointed back at the kernel: show the app at that address instead.
          frame.contentWindow.location.replace(appUrl(loc.search, loc.hash));
          return;
        }
        if (loc.origin !== location.origin || loc.pathname !== appPath) {
          location.href = loc.href; // The app navigated somewhere else entirely, so the tab goes there.
          return;
        }
        attach(frame.contentWindow);
        if (document.hasFocus()) frame.contentWindow.focus();
      });

      // The address bar's hash was edited by hand: hand it to the app without adding history.
      window.addEventListener('hashchange', function () {
        var loc = frameLocation();
        if (loc && loc.pathname === appPath && loc.hash !== location.hash) {
          frame.contentWindow.location.replace(appUrl(location.search, location.hash));
        }
      });

      function absolute(value, from) {
        if (!value || /^(data|blob|javascript|about):/i.test(value)) return null;
        try {
          var url = new URL(value, from);
          if (url.origin !== location.origin) return null;
          url.hash = '';
          return url.href;
        } catch (error) {
          return null;
        }
      }

      function timedFetch(url, ms) {
        var controller = typeof AbortController === 'function' ? new AbortController() : null;
        var timer = controller ? setTimeout(function () { controller.abort(); }, ms) : null;
        return fetch(url, { cache: 'no-cache', credentials: 'same-origin', signal: controller ? controller.signal : undefined })
          .finally(function () { clearTimeout(timer); });
      }

      // Revalidates one file against the server so the browser cache holds the newest copy.
      // Stylesheets also pull in what they point at, such as fonts.
      function refresh(url) {
        return timedFetch(url, 20000).then(function (response) {
          var type = response.headers.get('content-type') || '';
          if (!response.ok || type.indexOf('text/css') === -1) return response.arrayBuffer();
          return response.text().then(function (css) {
            var found = [];
            css.replace(/url\(\s*(['"]?)([^'")]+)\1\s*\)/g, function (match, quote, ref) {
              var next = absolute(ref, url);
              if (next) found.push(next);
              return match;
            });
            return Promise.allSettled(found.map(function (next) { return timedFetch(next, 20000).then(function (r) { return r.arrayBuffer(); }); }));
          });
        });
      }

      // Fetches the newest app document and every file it loads, skipping the browser cache,
      // then restarts the app in the frame. The tab itself never reloads. If the app can't be
      // reached (offline, say), this rejects and the running app carries on untouched.
      function checkForUpdates() {
        if (checking) return checking;
        var appHref = new URL(APP, base).href;
        checking = timedFetch(appHref, 15000)
          .then(function (response) {
            if (!response.ok) throw new Error('The app could not be fetched (HTTP ' + response.status + ').');
            return response.text();
          })
          .then(function (html) {
            var doc = new DOMParser().parseFromString(html, 'text/html');
            var assets = new Set();
            function add(value) {
              var url = absolute(value, appHref);
              if (url) assets.add(url);
            }
            doc.querySelectorAll('script[src]').forEach(function (node) { add(node.getAttribute('src')); });
            doc.querySelectorAll('link[href]').forEach(function (node) {
              if (/\b(stylesheet|preload|icon)\b/i.test(node.getAttribute('rel') || '')) add(node.getAttribute('href'));
            });
            doc.querySelectorAll('img[src]').forEach(function (node) { add(node.getAttribute('src')); });
            return Promise.allSettled(Array.from(assets, refresh));
          })
          .then(function () {
            // The app starts over from its own loading screen, just like a fresh visit.
            var loc = frameLocation();
            var target = appUrl(loc ? loc.search : location.search, loc ? loc.hash : location.hash);
            if (loc) frame.contentWindow.location.replace(target);
            else frame.src = target;
          })
          .finally(function () {
            checking = null;
          });
        return checking;
      }

      window.SoundboardKernel = { checkForUpdates: checkForUpdates };

      frame.src = appUrl(location.search, location.hash);
    })();
  </script>
</body>
</html>
